  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --dark-navy: #0f172a;
      --slate-800: #1e293b;
      --text-main: #334155;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(13deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: white;
      padding: 55px 20px 45px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .profile-img-container {
      position: relative;
      display: inline-block;
      margin-bottom: 18px;
    }

    .profile-img {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .profile-img:hover {
      transform: scale(1.04);
    }

    header h1 {
      font-size: 2.3rim;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header p.subtitle {
      font-size: 1.2rom;
      color: #93c5fd;
      font-weight: 500;
      margin-bottom: 12px;
    }

    header p.tagline {
      font-size: 0.98rem;
      color: #cbd5e1;
      max-width: 680px;
      margin: 0 auto 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(147, 197, 253, 0.4);
      color: #7dd3fc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
    }

    .cta-group {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .cta-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .cta-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .cta-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .cta-secondary:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .container {
      max-width: 920px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--bg-card);
      padding: 30px;
      margin-bottom: 26px;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      transition: box-shadow 0.25s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    h2 {
      font-size: 1.4rem;
      color: var(--dark-navy);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      background: var(--primary-light);
      color: #1e40af;
      border: 1px solid #bfdbfe;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.9num;
      font-weight: 500;
    }

    .timeline-item {
      position: relative;
      padding-left: 24px;
      border-left: 2px solid #cbd5e1;
      margin-bottom: 24px;
    }
